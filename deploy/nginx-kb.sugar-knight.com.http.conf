# Bootstrap vhost: enable this first, obtain the certificate with certbot
# --webroot, then replace it with nginx-kb.sugar-knight.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name kb.sugar-knight.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
